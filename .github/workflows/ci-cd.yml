name: EcoHospital CI/CD
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testes existentes e sintaxe do frontend
        run: |
          node --check public/app.js
          node --check src/server.js
          node src/test_mongodb_runner.js
      - name: Build, JUnit e empacotamento Spring Boot
        run: bash mvnw -B -ntp verify
      - name: Preservar relatórios e JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-tests-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/esg-app.jar
          if-no-files-found: warn
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Identificar imagem pelo commit
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Construir imagem (também em pull requests)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Testar imagem, usuário, volume e healthcheck
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f esg-smoke >/dev/null 2>&1 || true; docker volume rm esg-smoke-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name esg-smoke -p 127.0.0.1:18080:8080 -e APP_ENV=ci -v esg-smoke-data:/app/data "$IMAGE"
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' esg-smoke)
            [[ "$state" == healthy ]] && break
            [[ "$state" == unhealthy ]] && { docker logs esg-smoke; exit 1; }
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' esg-smoke)" == healthy ]]
          [[ "$(docker exec esg-smoke id -u)" == 10001 ]]
          mkdir -p evidence
          curl --fail --silent http://localhost:18080/health > evidence/container-health.json
          python3 - <<'PY'
          import json, os
          with open('evidence/container-health.json') as f:
              data = json.load(f)
          assert data == {'status': 'UP', 'environment': 'ci', 'version': os.environ['GITHUB_SHA']}, data
          PY
          curl --fail --silent -X POST http://localhost:18080/api/telemetria/simular >/dev/null
          docker restart esg-smoke
          sleep 5
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:18080/api/kpis > evidence/container-kpis.json && break
            sleep 2
          done
          python3 - <<'PY'
          import json
          with open('evidence/container-kpis.json') as f:
              data = json.load(f)
          assert data['totalLeiturasIot'] == 11, data
          PY
      - name: Autenticar no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem testada e obter digest imutável
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$reference" == ghcr.io/*@sha256:* ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
  staging:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.reference }}
      version: ${{ github.sha }}
  production:
    needs: [image, staging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.reference }}
      version: ${{ github.sha }}
  staging-pc:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LOCAL_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-pc.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.reference }}
      version: ${{ github.sha }}
  production-pc:
    needs: [image, staging-pc]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LOCAL_PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-pc.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.reference }}
      version: ${{ github.sha }}
