server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ecohospital-esg
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:development}
  storage-file: ${STORAGE_FILE:}
