server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ecohospital-esg
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:development}
  storage: ${APP_STORAGE:json}
  storage-file: ${STORAGE_FILE:}
  write-token: ${APP_WRITE_TOKEN:}
  write-token-file: ${APP_WRITE_TOKEN_FILE:}
  users-file: ${APP_USERS_FILE:}
  # A restauração do seed é destrutiva; em production, só habilite explicitamente em manutenção controlada.
  allow-production-reset: ${APP_ALLOW_PRODUCTION_RESET:false}
  postgres:
    url: ${POSTGRES_JDBC_URL:}
    user: ${POSTGRES_USER:}
    password-file: ${POSTGRES_PASSWORD_FILE:}
