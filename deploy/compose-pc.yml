# PC do laboratório: imagem aprovada, credenciais individuais por Environment.
services:
  app:
    image: ${IMAGE:?Defina a imagem GHCR pelo digest}
    environment:
      APP_ENV: ${APP_ENV:?Defina staging ou production}
      STORAGE_FILE: /app/data/state.json
      APP_WRITE_TOKEN_FILE: /run/secrets/operator_token
      APP_USERS_FILE: /run/secrets/operator_users
      PORT: "8080"
    secrets:
      - operator_token
      - operator_users
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:?Defina a porta}:8080"
    volumes:
      - esg-data:/app/data
    networks:
      - esg-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    stop_grace_period: 30s
volumes:
  esg-data:
networks:
  esg-network:
    driver: bridge
secrets:
  operator_token:
    file: ${OPERATOR_TOKEN_FILE:?Defina o token legado para rollback}
  operator_users:
    file: ${OPERATOR_USERS_FILE:?Defina o arquivo de credenciais individuais}
